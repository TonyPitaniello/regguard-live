# RegGuard API — Render Blueprint
services:
  - type: web
    name: regguard-api
    runtime: python
    plan: free
    region: oregon
    # Prefer repo root so scripts/render_build.sh resolves backend/requirements.txt
    buildCommand: bash scripts/render_build.sh
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Avoid bleeding-edge 3.14 on Render native; keep install surface stable
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: REG_GUARD_IC_DEMO
        value: "0"
