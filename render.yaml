# RegGuard API — Render Blueprint
services:
  - type: web
    name: regguard-api
    runtime: python
    plan: free
    region: oregon
    # Prefer repo root so scripts/render_build.sh resolves backend/requirements.txt
    buildCommand: bash scripts/render_build.sh
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Avoid bleeding-edge 3.14 on Render native; keep install surface stable
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: REG_GUARD_IC_DEMO
        value: "0"
      # Paid FinOps: bounded AHJ confirm (premortem F1/F2)
      - key: PAID_LOCAL_CONFIRM
        value: "1"
      - key: PAID_UNIVERSAL_SCOUT
        value: "0"
      - key: PAID_LOCAL_CONFIRM_MAX_PAGES
        value: "8"
      - key: PAID_LOCAL_CONFIRM_MAX_PER_DAY
        value: "25"
      - key: PAID_LOCAL_CONFIRM_CACHE_TTL_SEC
        value: "86400"
      - key: ZIP_WATCH_SELF_HEAL
        value: "1"
      # Quota file defaults to /tmp/regguard_data unless REGGUARD_DATA_DIR is set
      # (attach a persistent disk + shared path before multi-instance)

  # Daily ZIP watch — requires paid cron plan OR use cron-job.org against the web service.
  # Prefer: POST https://regguard-api.onrender.com/cron/zip-watch + X-Cron-Secret
  - type: cron
    name: regguard-zip-watch
    runtime: python
    plan: starter
    region: oregon
    schedule: "0 14 * * *"
    buildCommand: bash scripts/render_build.sh
    startCommand: >-
      python -c "import os,urllib.request; u=(os.environ.get('REG_GUARD_API_URL') or 'https://regguard-api.onrender.com').rstrip('/')+'/cron/zip-watch'; req=urllib.request.Request(u,data=b'',method='POST',headers={'X-Cron-Secret':os.environ.get('CRON_SECRET','')}); print(urllib.request.urlopen(req,timeout=120).read()[:200])"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CRON_SECRET
        sync: false
      - key: REG_GUARD_API_URL
        value: "https://regguard-api.onrender.com"
